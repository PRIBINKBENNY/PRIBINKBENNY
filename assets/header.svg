<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1000" height="220" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="220" rx="18" fill="url(#grid)"/>
  <!-- circuit traces -->
  <g stroke="url(#glow)" stroke-width="2" fill="none" opacity="0.55">
    <path d="M0 170 H120 L150 140 H260" stroke-dasharray="260" stroke-dashoffset="260"><animate attributeName="stroke-dashoffset" values="260;0;0;260" dur="6s" repeatCount="indefinite"/></path>
    <path d="M1000 50 H880 L850 80 H740" stroke-dasharray="260" stroke-dashoffset="260"><animate attributeName="stroke-dashoffset" values="260;0;0;260" dur="6s" begin="1.5s" repeatCount="indefinite"/></path>
    <path d="M1000 175 H900 L875 150 H800" stroke-dasharray="200" stroke-dashoffset="200"><animate attributeName="stroke-dashoffset" values="200;0;0;200" dur="6s" begin="3s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#38bdf8">
    <circle cx="260" cy="140" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="80" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="150" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <text x="500" y="102" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">Pribin K Benny</text>
  <text x="500" y="146" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="url(#glow)" letter-spacing="3">AI &amp; ROBOTICS ENGINEER</text>
  <rect x="440" y="164" width="120" height="3" rx="1.5" fill="url(#glow)">
    <animate attributeName="width" values="40;120;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="480;440;480" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
